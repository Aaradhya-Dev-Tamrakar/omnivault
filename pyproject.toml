[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivault"
dynamic = ["version"]
description = "Tri-tier archival, sub-second offline retrieval, and storage optimization engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Aaradhya Dev Tamrakar", email = "aaradhyadevtmr@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "blake3>=1.0.0",
    "pillow>=10.0.0",
    "watchdog>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
omnivault = "omnivault.cli:main"

[project.urls]
Repository = "https://github.com/Aaradhya-Dev-Tamrakar/omnivault"

[tool.setuptools.dynamic]
version = { attr = "omnivault.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["omnivault*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # long lines are handled by the formatter; embedded HTML/SQL strings are exempt
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
